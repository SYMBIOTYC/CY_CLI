name: Build Linux

on:
  repository_dispatch:
    types: [release-build]
  workflow_dispatch:
    inputs:
      private_repo:
        description: 'Private source repository (org/name)'
        required: true
        default: 'SYMBIOTYC/CY_CLI'
      tag:
        description: 'Git tag or branch to build'
        required: true
        default: 'v0.3.8'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            os: linux
            artifact: cy-x86_64-unknown-linux-gnu.tar.gz

    steps:
      - name: Checkout private source code
        uses: actions/checkout@v4
        with:
          repository: SYMBIOTYC/cy-cli
          ref: main
          path: cy-cli-private

      - name: Checkout release repo assets
        uses: actions/checkout@v4
        with:
          path: release-repo

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cy-cli-private/.fundament/cx-rs -> target

      - name: Install packaging tools
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y upx

      - name: Patch Cargo.toml for tungstenite unification
        shell: bash
        working-directory: cy-cli-private/.fundament/cx-rs
        run: |
          sed -i 's|tungstenite = { git = "https://github.com/SYMBIOTYC/tungstenite-rs", rev = "[^"]*" }|tungstenite = { git = "https://github.com/SYMBIOTYC/tungstenite-rs", branch = "main" }|g' Cargo.toml
          echo "Unified tungstenite patch in Cargo.toml"

      - name: Fetch dependencies
        shell: bash
        working-directory: cy-cli-private/.fundament/cx-rs
        run: |
          cargo generate-lockfile 2>&1 || echo "lockfile generated"
          cargo fetch 2>&1 || echo "fetch continued"

      - name: Patch rama-http Box<str> bug
        shell: bash
        run: |
          RAMA_DIR=$(find ~/.cargo/registry/src -type d -name "rama-http-0.3.0-alpha.4" 2>/dev/null | head -1)
          if [ -n "$RAMA_DIR" ] && [ -f "$RAMA_DIR/src/layer/har/spec.rs" ]; then
            sed -i 's/Self::Unknown(format!("{other:?}"))/Self::Unknown(format!("{other:?}").into())/g' "$RAMA_DIR/src/layer/har/spec.rs"
            echo "Patched $RAMA_DIR/src/layer/har/spec.rs"
          else
            echo "rama-http source not found"
          fi

      - name: Patch cx-api tungstenite imports
        shell: bash
        working-directory: cy-cli-private/.fundament/cx-rs
        run: |
          for f in cx-api/src/endpoint/realtime_websocket/methods.rs; do
            if [ -f "$f" ]; then
              sed -i 's/use tungstenite::protocol::WebSocketConfig;/use tokio_tungstenite::tungstenite::protocol::WebSocketConfig;/' "$f"
              sed -i 's/use tungstenite::protocol::frame::coding::CloseCode;/use tokio_tungstenite::tungstenite::protocol::frame::coding::CloseCode;/' "$f"
              echo "Patched $f"
            fi
          done

      - name: Build release binary
        working-directory: cy-cli-private/.fundament/cx-rs
        run: cargo build --bin cy --release --target ${{ matrix.target }}
        timeout-minutes: 120

      - name: Patch binary - remove trust prompt
        if: matrix.os != 'windows'
        shell: bash
        run: |
          python3 packaging/tools/patch-binary.py \
            "cy-cli-private/.fundament/cx-rs/target/${{ matrix.target }}/release/cy" || true

      - name: Strip binary (non-Windows)
        if: matrix.os != 'windows'
        run: |
          strip cy-cli-private/.fundament/cx-rs/target/${{ matrix.target }}/release/cy || true
          upx --best --lzma cy-cli-private/.fundament/cx-rs/target/${{ matrix.target }}/release/cy || true

      - name: Package Linux artifact
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          BIN="cy-cli-private/.fundament/cx-rs/target/${{ matrix.target }}/release/cy"
          cp "$BIN" cy
          cp release-repo/tools/launch-cy.sh launch-cy.sh
          chmod +x launch-cy.sh cy
          cp release-repo/packaging/bridge/cy_bridge.py cy_bridge.py
          cp release-repo/packaging/bridge/cy_auth_server.py cy_auth_server.py
          mkdir -p themes
          cp release-repo/packaging/themes/*.tmTheme themes/
          test -f cy_auth_server.py
          test -d themes
          tar czf ${{ matrix.artifact }} cy launch-cy.sh cy_bridge.py cy_auth_server.py themes
          sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256

      - name: Upload artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
          retention-days: 90

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Package release assets
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p release-assets
          cp artifacts/*/*.tar.gz release-assets/ 2>/dev/null || true
          cp artifacts/*/*.zip release-assets/ 2>/dev/null || true
          cp artifacts/*/*.dmg release-assets/ 2>/dev/null || true
          cp artifacts/*/*.pkg release-assets/ 2>/dev/null || true
          cp artifacts/*/*.exe release-assets/ 2>/dev/null || true
          cp artifacts/*/*.sha256 release-assets/ 2>/dev/null || true

      - name: Generate checksums manifest
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          cd release-assets
          find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.dmg' -o -name '*.pkg' -o -name '*.exe' \) -exec sha256sum {} + > SHA256SUMS

      - name: Create Release
        if: always()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.event.inputs.tag || github.event.client_payload.tag }}
          name: ${{ github.event.inputs.tag || github.event.client_payload.tag }}
          generate_release_notes: true
          files: |
            release-assets/*
