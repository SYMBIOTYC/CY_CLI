name: Build macOS

on:
  repository_dispatch:
    types: [release-build]
  workflow_dispatch:
    inputs:
      private_repo:
        description: 'Private source repository (org/name)'
        required: true
        default: 'SYMBIOTYC/cy-cli'
      tag:
        description: 'Git tag or branch to build'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write

jobs:
  build:
    name: Build macOS ${{ matrix.target }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            artifact: cy-aarch64-apple-darwin.dmg
            app_name: CY-CLI-arm64.app
          - target: x86_64-apple-darwin
            artifact: cy-x86_64-apple-darwin.dmg
            app_name: CY-CLI-intel.app

    steps:
      - name: Checkout release repo for icon
        uses: actions/checkout@v4
        with:
          path: .

      - name: Checkout private source code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.private_repo || github.event.client_payload.private_repo }}
          ref: ${{ github.event.inputs.tag || github.event.client_payload.tag }}
          token: ${{ secrets.PAT_FOR_PRIVATE_REPO }}
          path: cy-cli-private

      - name: Remove repo rust-toolchain override
        shell: bash
        run: rm -f cy-cli-private/.fundament/cx-rs/rust-toolchain.toml

      - name: Install Rust via rustup
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.95.0
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustup component add rust-std --target aarch64-apple-darwin
          rustup component add rust-std --target x86_64-apple-darwin
          rustup component add rust-src

      - name: Build release binary
        working-directory: cy-cli-private/.fundament/cx-rs
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
          CARGO_PROFILE_RELEASE_LTO: "fat"
          RUSTFLAGS: "-C link-arg=-Wl,-no_objc_relative_method_lists"
        run: cargo build --bin cy --release --target ${{ matrix.target }}

      - name: Patch binary branding
        shell: bash
        run: |
          BIN="cy-cli-private/.fundament/cx-rs/target/${{ matrix.target }}/release/cy"
          python3 -c "
          import sys
          with open(sys.argv[1], 'rb') as f:
              data = f.read()

          patches = [
              (b'0.0.0', b'0.2.0'),
              (b'Codex CLI', b'CY CLI   '),
              (b'Codex Apps', b'CY    Apps'),
              (b'Codex host', b'CY    host'),
              (b'Codex binary', b'CY    binary'),
              (b'Codex session', b'CY    session'),
              (b'Codex To', b'CY    To'),
              (b'Codex build error', b'CY build error   '),
              (b'standalone Codex', b'standalone CY   '),
              (b'Ask Code', b'Ask CY  '),
              (b'OpenAI API', b'SYMBIOTYC '),
              (b'OpenAI file', b'SYMBIOTYC  '),
          ]

          count = 0
          for old, new in patches:
              if len(old) != len(new):
                  print(f'SKIP: {old} ({len(old)}) != {new} ({len(new)})')
                  continue
              n = data.count(old)
              if n > 0:
                  data = data.replace(old, new)
                  print(f'OK: {old} -> {new} ({n}x)')
                  count += n

          with open(sys.argv[1], 'wb') as f:
              f.write(data)
          print(f'Patched: {count}')
          " "$BIN"

      - name: Create launcher script
        shell: bash
        run: |
          APP_NAME="${{ matrix.app_name }}"
          mkdir -p "$APP_NAME/Contents/MacOS"
          printf '#!/bin/bash\nCY_BIN="/Applications/CY-CLI.app/Contents/MacOS/cy"\nosascript -e "\ntell application \\"Terminal\\"\\n    activate\\n    set initialCount to count of windows\\n    do script \\"$CY_BIN\\"\\n    delay 0.5\\n    if initialCount = 0 then\\n        if (count of windows) > 1 then\\n            close (window 1)\\n        end if\\n    end if\\nend tell\\n"\n' > "$APP_NAME/Contents/MacOS/launcher"
          chmod +x "$APP_NAME/Contents/MacOS/launcher"

      - name: Create Info.plist
        shell: bash
        run: |
          APP_NAME="${{ matrix.app_name }}"
          mkdir -p "$APP_NAME/Contents/Resources"
          cat > "$APP_NAME/Contents/Info.plist" << 'PLISTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>launcher</string>
            <key>CFBundleIdentifier</key>
            <string>com.symbiotyc.cy-cli</string>
            <key>CFBundleName</key>
            <string>CY-CLI</string>
            <key>CFBundleDisplayName</key>
            <string>CY-CLI</string>
            <key>CFBundleVersion</key>
            <string>0.2.0</string>
            <key>CFBundleShortVersionString</key>
            <string>0.2.0</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>LSMinimumSystemVersion</key>
            <string>14.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLISTEOF

      - name: Package macOS .app
        shell: bash
        run: |
          BIN="cy-cli-private/.fundament/cx-rs/target/${{ matrix.target }}/release/cy"
          APP_NAME="${{ matrix.app_name }}"
          DMG_NAME="${{ matrix.artifact }}"

          cp "$BIN" "$APP_NAME/Contents/MacOS/cy"
          chmod +x "$APP_NAME/Contents/MacOS/cy"

          if [ -f icon.icns ]; then
            cp icon.icns "$APP_NAME/Contents/Resources/AppIcon.icns"
          fi

          hdiutil create -volname "CY-CLI" -srcfolder "$APP_NAME" -ov -format UDZO "$DMG_NAME"
          echo "Created $DMG_NAME"
          ls -lh "$DMG_NAME"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-dmg
          path: ${{ matrix.artifact }}
          retention-days: 90

      - name: Upload to GitHub Release
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.event.client_payload.tag }}
        run: |
          for i in {1..12}; do
            gh release upload "$TAG" ${{ matrix.artifact }} && break
            echo "Release not ready yet, retrying in 10s..."
            sleep 10
          done
