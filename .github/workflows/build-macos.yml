name: Build macOS

on:
  repository_dispatch:
    types: [release-build]
  workflow_dispatch:
    inputs:
      private_repo:
        description: 'Private source repository (org/name)'
        required: true
        default: 'SYMBIOTYC/cy-cli'
      tag:
        description: 'Git tag or branch to build'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write

jobs:
  build:
    name: Build macOS ${{ matrix.target }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            artifact: cy-aarch64-apple-darwin.dmg
            app_name: CY-CLI-arm64.app
          - target: x86_64-apple-darwin
            artifact: cy-x86_64-apple-darwin.dmg
            app_name: CY-CLI-intel.app

    steps:
      - name: Checkout release repo for icon
        uses: actions/checkout@v4
        with:
          path: .

      - name: Checkout private source code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.private_repo || github.event.client_payload.private_repo }}
          ref: ${{ github.event.inputs.tag || github.event.client_payload.tag }}
          token: ${{ secrets.PAT_FOR_PRIVATE_REPO }}
          path: cy-cli-private

      - name: Remove repo rust-toolchain override
        shell: bash
        run: rm -f cy-cli-private/.fundament/cx-rs/rust-toolchain.toml

      - name: Install Rust via rustup
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.95.0
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustup component add rust-std --target aarch64-apple-darwin
          rustup component add rust-std --target x86_64-apple-darwin
          rustup component add rust-src

      - name: Build release binary
        working-directory: cy-cli-private/.fundament/cx-rs
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
          CARGO_PROFILE_RELEASE_LTO: "true"
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "z"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          RUSTFLAGS: "-C link-arg=-Wl,-no_objc_relative_method_lists"
        run: cargo build --bin cy --release --target ${{ matrix.target }}

      - name: Patch binary branding
        run: |
          BIN="cy-cli-private/.fundament/cx-rs/target/${{ matrix.target }}/release/cy"
          if [ -f "$BIN" ]; then
            echo "Patching branding strings..."
            # Version: v0.0.0 -> v0.2.0 (same length, safe)
            LC_ALL=C sed -i '' 's/v0\.0\.0/v0.2.0/g' "$BIN"
            # Codex CLI -> CY CLI  (pad shorter with spaces or null)
            LC_ALL=C sed -i '' 's/Codex CLI/CY CLI /g' "$BIN"
            # OpenAI Codex -> SYMBIOTYC CY
            LC_ALL=C sed -i '' 's/OpenAI Codex/SYMBIOTYC CY/g' "$BIN"
            # Ask Codex -> Ask CY
            LC_ALL=C sed -i '' 's/Ask Codex/Ask CY  /g' "$BIN"
            # cy/i1a default -> CY | i1a
            LC_ALL=C sed -i '' 's/cy\/i1a default/CY | i1a    /g' "$BIN"
            echo "Branding patched."
          fi

      - name: Package macOS .app
        run: |
          BIN="cy-cli-private/.fundament/cx-rs/target/${{ matrix.target }}/release/cy"
          APP_NAME="${{ matrix.app_name }}"
          DMG_NAME="${{ matrix.artifact }}"

          mkdir -p "$APP_NAME/Contents/MacOS"
          mkdir -p "$APP_NAME/Contents/Resources"

          cp "$BIN" "$APP_NAME/Contents/MacOS/cy"
          chmod +x "$APP_NAME/Contents/MacOS/cy"

          # Launcher: opens Terminal with cy, closes extra windows
          cat > "$APP_NAME/Contents/MacOS/launcher" << 'LAUNCHER'
          #!/bin/bash
          CY_BIN="/Applications/CY-CLI.app/Contents/MacOS/cy"
          osascript -e "
          tell application \"Terminal\"
              activate
              set winList to windows
              set initialCount to count of winList
              do script \"$CY_BIN\"
              delay 0.5
              -- close the initial blank window if Terminal was freshly opened
              if initialCount = 0 then
                  if (count of windows) > 1 then
                      close (window 1)
                  end if
              end if
          end tell
          "
          LAUNCHER
          chmod +x "$APP_NAME/Contents/MacOS/launcher"

          # Icon
          if [ -f icon.icns ]; then
            cp icon.icns "$APP_NAME/Contents/Resources/AppIcon.icns"
          fi

          cat > "$APP_NAME/Contents/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>launcher</string>
            <key>CFBundleIdentifier</key>
            <string>com.symbiotyc.cy-cli</string>
            <key>CFBundleName</key>
            <string>CY-CLI</string>
            <key>CFBundleDisplayName</key>
            <string>CY-CLI</string>
            <key>CFBundleVersion</key>
            <string>0.2.0</string>
            <key>CFBundleShortVersionString</key>
            <string>0.2.0</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>LSMinimumSystemVersion</key>
            <string>14.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>LSUIElement</key>
            <false/>
          </dict>
          </plist>
          PLIST

          hdiutil create -volname "CY-CLI" -srcfolder "$APP_NAME" -ov -format UDZO "$DMG_NAME"
          echo "Created $DMG_NAME"
          ls -lh "$DMG_NAME"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-dmg
          path: ${{ matrix.artifact }}
          retention-days: 90

      - name: Upload to GitHub Release
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.event.client_payload.tag }}
        run: |
          for i in {1..12}; do
            gh release upload "$TAG" ${{ matrix.artifact }} && break
            echo "Release not ready yet, retrying in 10s..."
            sleep 10
          done