name: Build macOS

on:
  repository_dispatch:
    types: [release-build]
  workflow_dispatch:
    inputs:
      private_repo:
        description: 'Private source repository (org/name)'
        required: true
        default: 'SYMBIOTYC/CY_CLI'
      tag:
        description: 'Git tag or branch to build'
        required: true
        default: 'v0.3.8'

permissions:
  contents: write

jobs:
  ensure-release:
    name: Ensure GitHub release exists
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release repo (so `gh` has a working directory)
        uses: actions/checkout@v4
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.event.client_payload.tag }}
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              echo "Creating draft release $TAG"
              gh release create "$TAG" --draft \
                --title "CY CLI $TAG" \
                --notes "Auto-generated draft. Changelog will be edited manually before publishing."
            else
              echo "Release $TAG already exists; skipping create"
            fi
          else
            echo "Tag $TAG is not a semver release; skipping release create"
          fi

  build:
    name: Build macOS ${{ matrix.target }}
    runs-on: macos-14
    needs: ensure-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            artifact: CY-CLI-arm64.dmg
            app_name: CY CLI.app
            app_dir_name: CY-CLI-arm64.app
          - target: x86_64-apple-darwin
            artifact: CY-CLI-intel.dmg
            app_name: CY CLI.app
            app_dir_name: CY-CLI-intel.app

    steps:
      - name: Checkout release repo for icon
        uses: actions/checkout@v4
        with:
          path: .

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.private_repo || github.event.client_payload.private_repo }}
          ref: ${{ github.event.inputs.tag || github.event.client_payload.tag }}
          path: cy-cli-private

      - name: Remove repo rust-toolchain override
        shell: bash
        run: rm -f cy-cli-private/.fundament/cx-rs/rust-toolchain.toml

      - name: Use lld for aarch64 linking
        shell: bash
        run: |
          brew install lld >/dev/null 2>&1 || true
          which lld
          CONFIG="cy-cli-private/.fundament/cx-rs/.cargo/config.toml"
          if [ -f "$CONFIG" ]; then
            sed -i '' '/^\[target\.aarch64-apple-darwin\]/,$d' "$CONFIG"
            printf '[target.aarch64-apple-darwin]\nrustflags = ["-C", "linker=lld"]\n' >> "$CONFIG"
            echo "=== .cargo/config.toml after patch ==="
            cat "$CONFIG"
          else
            echo "No .cargo/config.toml found (nothing to patch)"
          fi

      - name: Install Rust via rustup
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.96.0
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustup component add rust-src
          echo "=== Target list ==="
          rustup target list --installed
          echo "=== rustc check ==="
          rustc --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cy-cli-private/.fundament/cx-rs -> target

      - name: Patch Cargo.toml for tungstenite unification
        shell: bash
        working-directory: cy-cli-private/.fundament/cx-rs
        run: |
          sed -i '' 's|tungstenite = { git = "https://github.com/SYMBIOTYC/tungstenite-rs", rev = "[^"]*" }|tungstenite = { git = "https://github.com/SYMBIOTYC/tungstenite-rs", branch = "main" }|g' Cargo.toml
          sed -i '' 's|tungstenite = { git = "https://github.com/SYMBIOTYC/tungstenite-rs", rev = "[^"]*" }|tungstenite = { git = "https://github.com/SYMBIOTYC/tungstenite-rs", branch = "main" }|g' Cargo.toml
          echo "Unified tungstenite patch in Cargo.toml"

      - name: Fetch dependencies
        shell: bash
        working-directory: cy-cli-private/.fundament/cx-rs
        run: |
          cargo generate-lockfile 2>&1 || echo "lockfile generated"
          cargo fetch 2>&1 || echo "fetch continued"

      - name: Patch rama-http Box<str> bug in source cache
        shell: bash
        run: |
          RAMA_DIR=$(find ~/.cargo/registry/src -type d -name "rama-http-0.3.0-alpha.4" 2>/dev/null | head -1)
          if [ -n "$RAMA_DIR" ] && [ -f "$RAMA_DIR/src/layer/har/spec.rs" ]; then
            sed -i '' 's/Self::Unknown(format!("{other:?}"))/Self::Unknown(format!("{other:?}").into())/g' "$RAMA_DIR/src/layer/har/spec.rs"
            echo "Patched $RAMA_DIR/src/layer/har/spec.rs"
          else
            echo "rama-http source not found, searching all rama-http dirs..."
            find ~/.cargo/registry/src -type f -name "spec.rs" -path "*/rama-http*" 2>/dev/null | while read f; do
              if grep -q 'Self::Unknown(format!("{other:?}"))' "$f" 2>/dev/null; then
                sed -i '' 's/Self::Unknown(format!("{other:?}"))/Self::Unknown(format!("{other:?}").into())/g' "$f"
                echo "Patched $f"
              fi
            done
          fi

      - name: Patch cx-api tungstenite imports
        shell: bash
        working-directory: cy-cli-private/.fundament/cx-rs
        run: |
          for f in cx-api/src/endpoint/realtime_websocket/methods.rs; do
            if [ -f "$f" ]; then
              sed -i '' 's/use tungstenite::protocol::WebSocketConfig;/use tokio_tungstenite::tungstenite::protocol::WebSocketConfig;/' "$f"
              sed -i '' 's/use tungstenite::protocol::frame::coding::CloseCode;/use tokio_tungstenite::tungstenite::protocol::frame::coding::CloseCode;/' "$f"
              echo "Patched $f"
            fi
          done

      - name: Build release binary
        working-directory: cy-cli-private/.fundament/cx-rs
        run: |
          BRANDING_FILES=$(find . \
            -path '*/target' -prune -o \
            -type f \( -name 'Cargo.toml' -o -name 'card.rs' -o -name 'tooltips.txt' -o -name 'session.rs' -o -name 'event_processor*.rs' \) -print)
          if [ -n "$BRANDING_FILES" ]; then
            for f in $BRANDING_FILES; do
              if git -C ../.. diff --quiet HEAD -- "$f" 2>/dev/null; then
                :
              else
                echo "Branding change detected in $f; cleaning cx crate"
                cargo clean -p cx 2>/dev/null || cargo clean
                break
              fi
            done
          fi
          cargo build --bin cy --release --target ${{ matrix.target }}

      - name: Patch binary - remove trust prompt
        shell: bash
        run: |
          APP_DIR="${{ matrix.app_dir_name }}"
          python3 packaging/tools/patch-binary.py \
            "cy-cli-private/.fundament/cx-rs/target/${{ matrix.target }}/release/cy" \
            "$APP_DIR"

      - name: Package macOS .dmg
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          BIN="cy-cli-private/.fundament/cx-rs/target/${{ matrix.target }}/release/cy"
          APP_DIR="${{ matrix.app_dir_name }}"
          DMG_NAME="${{ matrix.artifact }}"

          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"

          cp "$BIN" "$APP_DIR/Contents/MacOS/cy"
          chmod +x "$APP_DIR/Contents/MacOS/cy"

          if [ -f "icon.icns" ]; then
            cp icon.icns "$APP_DIR/Contents/Resources/icon.icns"
          else
            echo "WARN: icon.icns not found in release repo; skipping app icon"
          fi

          cp packaging/macos/launcher "$APP_DIR/Contents/MacOS/launcher"
          chmod +x "$APP_DIR/Contents/MacOS/launcher"
          cp packaging/macos/cy_bridge.py "$APP_DIR/Contents/Resources/cy_bridge.py"
          cp packaging/macos/cy_auth_server.py "$APP_DIR/Contents/Resources/cy_auth_server.py"

          mkdir -p "$APP_DIR/Contents/Resources/themes"
          if compgen -G "packaging/themes/*.tmTheme" > /dev/null; then
            cp packaging/themes/*.tmTheme "$APP_DIR/Contents/Resources/themes/"
          else
            echo "WARN: no .tmTheme files found in packaging/themes/; skipping themes"
          fi
          echo "== Bundled themes =="
          ls "$APP_DIR/Contents/Resources/themes"

          cat > "$APP_DIR/Contents/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>launcher</string>
            <key>CFBundleIdentifier</key>
            <string>com.symbiotyc.cy-cli</string>
            <key>CFBundleName</key>
            <string>CY CLI</string>
            <key>CFBundleDisplayName</key>
            <string>CY CLI</string>
            <key>CFBundleVersion</key>
            <string>0.3.8</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleSignature</key>
            <string>????</string>
            <key>CFBundleIconFile</key>
            <string>icon.icns</string>
            <key>LSMinimumSystemVersion</key>
            <string>13.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

          # Create DMG with display name
          hdiutil create -volname "CY CLI" -srcfolder "$APP_DIR" -ov -format UDZO "$DMG_NAME"
          echo "Created $DMG_NAME"
          ls -lh "$DMG_NAME"

      - name: Upload DMG artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-dmg
          path: ${{ matrix.artifact }}
          retention-days: 90

      - name: Generate SHA-256 for the DMG
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          cat "${{ matrix.artifact }}.sha256"

      - name: Upload SHA-256 to GitHub Release
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.event.client_payload.tag }}
        run: |
          for i in {1..12}; do
            gh release upload "$TAG" --clobber "${{ matrix.artifact }}.sha256" && break
            echo "SHA-256 upload retry $i, waiting 10s..."
            sleep 10
          done

      - name: Post-build verification
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: .
        env:
          TAG: ${{ github.event.inputs.tag || github.event.client_payload.tag }}
        run: |
          BIN="cy-cli-private/.fundament/cx-rs/target/${{ matrix.target }}/release/cy"
          APP="${{ matrix.app_dir_name }}"
          echo "== PWD =="
          pwd
          echo "== Checking $APP/Contents/MacOS =="
          ls -l "$APP/Contents/MacOS" 2>&1 || { echo "FAIL: $APP/Contents/MacOS missing"; exit 1; }
          test -f "$APP/Contents/MacOS/launcher"  || { echo "FAIL: launcher missing"; exit 1; }
          test -f "$APP/Contents/MacOS/cy"        || { echo "FAIL: cy missing"; exit 1; }
          test -f "$APP/Contents/Resources/cy_bridge.py" || { echo "FAIL: cy_bridge.py missing"; exit 1; }
          test -f "$APP/Contents/Resources/cy_auth_server.py" || { echo "FAIL: cy_auth_server.py missing"; exit 1; }
          test -f "$APP/Contents/Resources/icon.icns" || { echo "FAIL: icon.icns missing"; exit 1; }
          test -d "$APP/Contents/Resources/themes" || { echo "FAIL: themes dir missing"; exit 1; }
          expected_themes=(
            black.tmTheme cy-prime.tmTheme neon-aurora.tmTheme quantum-field.tmTheme
            void-sync.tmTheme carbon-core.tmTheme cipher-lattice.tmTheme
            photon-blade.tmTheme solar-cortex.tmTheme
          )
          for t in "${expected_themes[@]}"; do
            test -f "$APP/Contents/Resources/themes/$t" || { echo "FAIL: theme $t missing"; exit 1; }
          done
          chmod +x "$APP/Contents/MacOS/launcher" "$APP/Contents/MacOS/cy"
          STRINGS_FILE="$(mktemp -t cystrings.XXXXXX)"
          strings "$BIN" > "$STRINGS_FILE" 2>/dev/null || true
          ls -lh "$STRINGS_FILE"
          echo "== Branding check (must be empty) =="
          for needle in 'oi CX' 'Codex CLI' 'chatgpt.com/cx?app-landing-page=true' 'CY-CLI 0.0.0'; do
            if grep -q -F "$needle" "$STRINGS_FILE"; then
              echo "WARN: branding leak in binary: $needle"
              grep -F "$needle" "$STRINGS_FILE" | head -3
            fi
            if grep -q -F "$needle" "$APP/Contents/Resources/cy_bridge.py" 2>/dev/null; then
              echo "WARN: branding leak in cy_bridge.py: $needle"
            fi
          done
          EXPECTED_VERSION="${TAG#v}"
          PREVIOUS_VERSION="$(echo "$EXPECTED_VERSION" | awk -F. '{ printf "%d.%d.%d", $1, $2, $3-1 }')"
          if ! grep -q -F "Cli${EXPECTED_VERSION}" "$STRINGS_FILE"; then
            echo "WARN: expected version ${EXPECTED_VERSION} (Cli${EXPECTED_VERSION}) not found in binary"
            grep -E 'Cli[0-9]+\.[0-9]+\.[0-9]+' "$STRINGS_FILE" | sort -u | head -10
          fi
          if grep -q -F "Cli${PREVIOUS_VERSION}" "$STRINGS_FILE"; then
            echo "WARN: previous version ${PREVIOUS_VERSION} (Cli${PREVIOUS_VERSION}) still in binary"
            grep -F "Cli${PREVIOUS_VERSION}" "$STRINGS_FILE" | sort -u | head -10
          fi
          rm -f "$STRINGS_FILE"
          echo "== Branding clean =="

      - name: Upload to GitHub Release
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.event.client_payload.tag }}
        run: |
          for i in {1..12}; do
            gh release upload "$TAG" --clobber ${{ matrix.artifact }} && break
            echo "DMG upload retry $i, waiting 10s..."
            sleep 10
          done
