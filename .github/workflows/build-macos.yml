name: Build macOS

on:
  repository_dispatch:
    types: [release-build]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag for release'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write

jobs:
  build:
    name: Build macOS ${{ matrix.target }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            artifact: cy-aarch64-apple-darwin.dmg
            app_name: CY-CLI-arm64.app
          - target: x86_64-apple-darwin
            artifact: cy-x86_64-apple-darwin.dmg
            app_name: CY-CLI-intel.app

    steps:
      - name: Checkout release repo
        uses: actions/checkout@v4
        with:
          path: .

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Create Cargo project
        run: |
          mkdir -p cy-build/src
          cat > cy-build/Cargo.toml << 'CARGO'
          [package]
          name = "cy"
          version = "0.2.0"
          edition = "2021"

          [dependencies]
          ureq = { version = "2", features = ["json"] }
          serde = { version = "1", features = ["derive"] }
          serde_json = "1"
          toml = "0.8"
          CARGO

          cat > cy-build/src/main.rs << 'RUST'
          use serde::Deserialize;
          use std::io::{self, Write};
          use std::path::PathBuf;

          #[derive(Deserialize)]
          struct Config {
              model: Option<String>,
              model_providers: Option<std::collections::HashMap<String, Provider>>,
          }

          #[derive(Deserialize, Clone)]
          struct Provider {
              base_url: Option<String>,
              experimental_bearer_token: Option<String>,
          }

          fn config_path() -> PathBuf {
              let home = std::env::var("HOME").unwrap_or_else(|_| ".".into());
              PathBuf::from(home).join(".codex").join("config.toml")
          }

          fn load_config() -> Config {
              let path = config_path();
              let content = std::fs::read_to_string(&path).unwrap_or_else(|e| {
                  eprintln!("CY: cannot read {}: {}", path.display(), e);
                  std::process::exit(1);
              });
              toml::from_str(&content).unwrap_or_else(|e| {
                  eprintln!("CY: cannot parse config: {}", e);
                  std::process::exit(1);
              })
          }

          fn main() {
              let config = load_config();
              let model = config.model.unwrap_or_else(|| "cy/i1a".into());

              let provider = config
                  .model_providers
                  .and_then(|m| m.get("cy").cloned())
                  .expect("no cy provider in config");

              let base_url = provider.base_url.unwrap_or_else(|| {
                  "https://api.symbiotyc.workers.dev/v1".into()
              });
              let token = provider.experimental_bearer_token.unwrap_or_else(|| {
                  eprintln!("CY: no bearer token in config");
                  std::process::exit(1);
              });

              println!("CY CLI v0.2.0  model={}", model);
              println!("Type your message and press Enter. Ctrl+C to exit.\n");

              let mut messages: Vec<serde_json::Value> = Vec::new();

              loop {
                  print!("> ");
                  io::stdout().flush().unwrap();

                  let mut input = String::new();
                  let n = io::stdin().read_line(&mut input).unwrap_or(0);
                  if n == 0 {
                      break;
                  }
                  let input = input.trim();
                  if input.is_empty() {
                      continue;
                  }

                  messages.push(serde_json::json!({
                      "role": "user",
                      "content": input
                  }));

                  let body = serde_json::json!({
                      "model": model,
                      "messages": messages,
                      "max_tokens": 4096,
                  });

                  let url = format!("{}/chat/completions", base_url);

                  let resp = match ureq::post(&url)
                      .set("Authorization", &format!("Bearer {}", token))
                      .set("Content-Type", "application/json")
                      .send_json(&body)
                  {
                      Ok(r) => r,
                      Err(e) => {
                          eprintln!("CY: request error: {}", e);
                          messages.pop();
                          continue;
                      }
                  };

                  let val: serde_json::Value = match resp.into_json() {
                      Ok(v) => v,
                      Err(e) => {
                          eprintln!("CY: parse error: {}", e);
                          messages.pop();
                          continue;
                      }
                  };

                  let content = val["choices"][0]["message"]["content"]
                      .as_str()
                      .unwrap_or("(no content)");

                  println!("\n{}\n", content);

                  messages.push(serde_json::json!({
                      "role": "assistant",
                      "content": content
                  }));
              }
          }
          RUST

      - name: Build release binary
        working-directory: cy-build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package macOS .dmg
        run: |
          BIN="cy-build/target/${{ matrix.target }}/release/cy"
          APP_NAME="${{ matrix.app_name }}"
          DMG_NAME="${{ matrix.artifact }}"

          mkdir -p "$APP_NAME/Contents/MacOS"
          mkdir -p "$APP_NAME/Contents/Resources"

          cp "$BIN" "$APP_NAME/Contents/MacOS/cy"
          chmod +x "$APP_NAME/Contents/MacOS/cy"

          cp icon.icns "$APP_NAME/Contents/Resources/icon.icns"

          cat > "$APP_NAME/Contents/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>cy</string>
            <key>CFBundleIdentifier</key>
            <string>com.symbiotyc.cy-cli</string>
            <key>CFBundleName</key>
            <string>CY-CLI</string>
            <key>CFBundleDisplayName</key>
            <string>CY-CLI</string>
            <key>CFBundleVersion</key>
            <string>0.2.0</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleSignature</key>
            <string>????</string>
            <key>CFBundleIconFile</key>
            <string>icon.icns</string>
            <key>LSMinimumSystemVersion</key>
            <string>13.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

          hdiutil create -volname "CY-CLI" -srcfolder "$APP_NAME" -ov -format UDZO "$DMG_NAME"
          echo "Created $DMG_NAME"
          ls -lh "$DMG_NAME"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-dmg
          path: ${{ matrix.artifact }}
          retention-days: 90

      - name: Upload to GitHub Release
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.event.client_payload.tag }}
        run: |
          for i in {1..12}; do
            gh release upload "$TAG" ${{ matrix.artifact }} && break
            echo "Release not ready yet, retrying in 10s..."
            sleep 10
          done
