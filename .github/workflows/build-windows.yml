name: Build Windows

on:
  repository_dispatch:
    types: [release-build]
  workflow_dispatch:
    inputs:
      private_repo:
        description: 'Private source repository (org/name)'
        required: true
        default: 'SYMBIOTYC/CY_CLI'
      tag:
        description: 'Git tag or branch to build'
        required: true
        default: 'v0.3.8'

permissions:
  contents: write

jobs:
  ensure-release:
    name: Ensure GitHub release exists
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release repo (so `gh` has a working directory)
        uses: actions/checkout@v4
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.event.client_payload.tag }}
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              echo "Creating draft release $TAG"
              gh release create "$TAG" --draft \
                --title "CY-CLI $TAG" \
                --notes "Auto-generated draft. Changelog will be edited manually before publishing."
            else
              echo "Release $TAG already exists; skipping create"
            fi
          else
            echo "Tag $TAG is not a semver release; skipping release create"
          fi

  build:
    name: Build Windows
    needs: ensure-release
    runs-on: windows-2022
    steps:
      - name: Checkout private source code
        uses: actions/checkout@v4
        with:
          repository: SYMBIOTYC/cy-cli
          ref: main
          path: cy-cli-private

      - name: Checkout release repo assets
        uses: actions/checkout@v4
        with:
          path: release-repo

      - name: Patch recursion limit for Windows
        shell: bash
        run: |
          find cy-cli-private/.fundament/cx-rs -name "lib.rs" -path "*/exec/*" -exec sed -i '1i #![recursion_limit = "256"]' {} +
          find cy-cli-private/.fundament/cx-rs -name "lib.rs" -path "*/tui/*" -exec sed -i '1i #![recursion_limit = "256"]' {} +

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cy-cli-private/.fundament/cx-rs -> target

      - name: Patch mio for Windows
        working-directory: cy-cli-private/.fundament/cx-rs
        run: |
          cargo update -p mio
          cargo tree -p mio

      - name: Patch Cargo.toml for tungstenite unification
        shell: bash
        working-directory: cy-cli-private/.fundament/cx-rs
        run: |
          sed -i 's|tungstenite = { git = "https://github.com/SYMBIOTYC/tungstenite-rs", rev = "[^"]*" }|tungstenite = { git = "https://github.com/SYMBIOTYC/tungstenite-rs", branch = "main" }|g' Cargo.toml
          echo "Unified tungstenite patch in Cargo.toml"

      - name: Fetch dependencies
        shell: bash
        working-directory: cy-cli-private/.fundament/cx-rs
        run: |
          cargo generate-lockfile 2>&1 || echo "lockfile generated"
          cargo fetch 2>&1 || echo "fetch continued"

      - name: Patch rama-http Box<str> bug
        shell: bash
        run: |
          RAMA_DIR=$(find ~/.cargo/registry/src -type d -name "rama-http-0.3.0-alpha.4" 2>/dev/null | head -1)
          if [ -n "$RAMA_DIR" ] && [ -f "$RAMA_DIR/src/layer/har/spec.rs" ]; then
            sed -i 's/Self::Unknown(format!("{other:?}"))/Self::Unknown(format!("{other:?}").into())/g' "$RAMA_DIR/src/layer/har/spec.rs"
            echo "Patched $RAMA_DIR/src/layer/har/spec.rs"
          else
            echo "rama-http source not found"
          fi

      - name: Patch cx-api tungstenite imports
        shell: bash
        working-directory: cy-cli-private/.fundament/cx-rs
        run: |
          for f in cx-api/src/endpoint/realtime_websocket/methods.rs; do
            if [ -f "$f" ]; then
              sed -i 's/use tungstenite::protocol::WebSocketConfig;/use tokio_tungstenite::tungstenite::protocol::WebSocketConfig;/' "$f"
              sed -i 's/use tungstenite::protocol::frame::coding::CloseCode;/use tokio_tungstenite::tungstenite::protocol::frame::coding::CloseCode;/' "$f"
              echo "Patched $f"
            fi
          done

      - name: Build release binary
        working-directory: cy-cli-private/.fundament/cx-rs
        run: cargo build --bin cy --release --target x86_64-pc-windows-msvc
        timeout-minutes: 120

      - name: Patch binary - remove trust prompt
        shell: bash
        run: |
          python3 packaging/tools/patch-binary.py \
            "cy-cli-private/.fundament/cx-rs/target/x86_64-pc-windows-msvc/release/cy.exe" || true

      - name: Package Windows artifact
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          BIN="cy-cli-private/.fundament/cx-rs/target/x86_64-pc-windows-msvc/release/cy.exe"
          cp "$BIN" cy.exe
          mkdir -p zip-stage/themes
          cp cy.exe zip-stage/
          cp release-repo/tools/launch-cy.ps1 zip-stage/
          cp release-repo/packaging/bridge/cy_bridge.py zip-stage/
          cp release-repo/packaging/bridge/cy_auth_server.py zip-stage/
          cp release-repo/packaging/themes/*.tmTheme zip-stage/themes/
          test -f zip-stage/cy_auth_server.py
          test -d zip-stage/themes
          powershell Compress-Archive -Path 'zip-stage/*' -DestinationPath cy-x86_64-pc-windows-msvc.zip
          powershell -Command "Get-FileHash -Algorithm SHA256 cy-x86_64-pc-windows-msvc.zip | Select-Object -ExpandProperty Hash | Set-Content -Encoding ASCII -NoNewline -Path cy-x86_64-pc-windows-msvc.zip.sha256"

      - name: Build Windows .exe installer
        if: always()
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $BIN = "cy-cli-private/.fundament/cx-rs/target/x86_64-pc-windows-msvc/release/cy.exe"
          $WRAPPER = "${{ github.workspace }}\release-repo\tools\cy-wrapper.ps1"
          $VERSION = "${{ github.event.inputs.tag || github.event.client_payload.tag }}".TrimStart('v')

          & "${{ github.workspace }}\release-repo\tools\build-installer.ps1" `
            -BinPath $BIN `
            -WrapperPath $WRAPPER `
            -Version $VERSION `
            -LauncherPath "${{ github.workspace }}\release-repo\tools\launch-cy.ps1" `
            -BridgePath "${{ github.workspace }}\release-repo\packaging\bridge\cy_bridge.py" `
            -AuthServerPath "${{ github.workspace }}\release-repo\packaging\bridge\cy_auth_server.py" `
            -ThemesDir "${{ github.workspace }}\release-repo\packaging\themes" `
            -OutDir "${{ github.workspace }}"
        timeout-minutes: 30

      - name: Upload artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: x86_64-pc-windows-msvc
          path: |
            cy-x86_64-pc-windows-msvc.zip
            cy-x86_64-pc-windows-msvc.zip.sha256
            CY-CLI-x86_64-setup.exe
            CY-CLI-x86_64-setup.exe.sha256
          retention-days: 90

      - name: Verify artifacts exist
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          test -f cy-x86_64-pc-windows-msvc.zip || { echo "WARN: zip missing"; }
          test -f cy-x86_64-pc-windows-msvc.zip.sha256 || { echo "WARN: zip sha256 missing"; }
          test -f CY-CLI-x86_64-setup.exe || { echo "WARN: installer missing"; }
          test -f CY-CLI-x86_64-setup.exe.sha256 || { echo "WARN: installer sha256 missing"; }
          ls -lh cy-x86_64-pc-windows-msvc.zip CY-CLI-x86_64-setup.exe 2>/dev/null || true

      - name: Upload to GitHub Release
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.event.client_payload.tag }}
        run: |
          cd release-repo
          for i in {1..12}; do
            gh release upload "$TAG" ../cy-x86_64-pc-windows-msvc.zip ../cy-x86_64-pc-windows-msvc.zip.sha256 ../CY-CLI-x86_64-setup.exe ../CY-CLI-x86_64-setup.exe.sha256 && break
            echo "Release not ready yet, retrying in 10s..."
            sleep 10
          done
