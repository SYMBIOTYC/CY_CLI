name: Build Windows

on:
  workflow_dispatch:
    inputs:
      private_repo:
        description: 'Private source repository (org/name)'
        required: true
        default: 'SYMBIOTYC/cy-cli'
      tag:
        description: 'Git tag or branch to build'
        required: true
        default: 'v0.1.5'

permissions:
  contents: write

jobs:
  build:
    name: Build Windows
    runs-on: windows-2022
    steps:
      - name: Checkout private source code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.private_repo }}
          ref: ${{ github.event.inputs.tag }}
          token: ${{ secrets.PAT_FOR_PRIVATE_REPO }}
          path: cy-cli-private

      - name: Patch recursion limit for Windows
        shell: bash
        run: |
          find cy-cli-private/.fundament/codex-rs -name "lib.rs" -path "*/exec/*" -exec sed -i '1i #![recursion_limit = "256"]' {} +
          find cy-cli-private/.fundament/codex-rs -name "lib.rs" -path "*/tui/*" -exec sed -i '1i #![recursion_limit = "256"]' {} +

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          cache: true

      - name: Patch mio for Windows
        working-directory: cy-cli-private/.fundament/codex-rs
        run: |
          cargo update -p mio
          cargo tree -p mio

      - name: Patch recursion limit for Windows
        shell: bash
        run: |
          find cy-cli-private/.fundament/codex-rs -name "lib.rs" -path "*/exec/*" -exec sed -i '1i #![recursion_limit = "256"]' {} +
          find cy-cli-private/.fundament/codex-rs -name "lib.rs" -path "*/tui/*" -exec sed -i '1i #![recursion_limit = "256"]' {} +

      - name: Build release binary
        working-directory: cy-cli-private/.fundament/codex-rs
        run: cargo build --bin cy --release --target x86_64-pc-windows-msvc
        timeout-minutes: 120

      - name: Package Windows artifact
        shell: bash
        run: |
          BIN="cy-cli-private/.fundament/codex-rs/target/x86_64-pc-windows-msvc/release/cy.exe"
          cp "$BIN" cy.exe
          powershell Compress-Archive -Path cy.exe -DestinationPath cy-x86_64-pc-windows-msvc.zip
          powershell -Command "Get-FileHash -Algorithm SHA256 cy-x86_64-pc-windows-msvc.zip | Select-Object -ExpandProperty Hash | Out-File -FilePath cy-x86_64-pc-windows-msvc.zip.sha256"

      - name: Build Windows .exe installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $BIN = "cy-cli-private/.fundament/codex-rs/target/x86_64-pc-windows-msvc/release/cy.exe"
          $WRAPPER = "${{ github.workspace }}/tools/cy-wrapper.ps1"
          $INSTALLER = "CY-CLI-x86_64-setup.exe"
          $VERSION = "${{ github.event.inputs.tag }}".TrimStart('v')

          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/bin" | Out-Null
          Copy-Item $BIN "${{ github.workspace }}/bin/cy.exe"

          choco install innosetup -y --no-progress

          "CY-CLI is licensed under the Apache License 2.0." | Out-File license.txt
          "See https://github.com/SYMBIOTYC/CY-CLI-releases/blob/main/LICENSE" | Out-File -Append license.txt

          @"
          ; CY-CLI Windows Installer
          #define MyAppName "CY-CLI"
          #define MyAppVersion "$VERSION"
          #define MyAppPublisher "SYMBIOTYC"
          #define MyAppURL "https://github.com/SYMBIOTYC/CY-CLI-releases"
          #define MyAppExeName "cy-wrapper.ps1"

          [Setup]
          AppId={{A1B2C3D4-E5F6-7890-ABCD-EF1234567890}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppVerName={#MyAppName} {#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          AppPublisherURL={#MyAppURL}
          AppSupportURL={#MyAppURL}
          AppUpdatesURL={#MyAppURL}
          DefaultDirName={localappdata}\Programs\{#MyAppName}
          DefaultGroupName={#MyAppName}
          DisableProgramGroupPage=yes
          LicenseFile=license.txt
          OutputDir=.
          OutputBaseFilename=CY-CLI-x86_64-setup
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesInstallIn64BitMode=x64
          ArchitecturesAllowed=x64

          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"
          Name: "russian"; MessagesFile: "compiler:Languages\Russian.isl"

          [Files]
          Source: "bin\cy.exe"; DestDir: "{app}\bin"; Flags: ignoreversion
          Source: "cy-wrapper.ps1"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{group}\{#MyAppName}"; Filename: "{app}\cy-wrapper.ps1"
          Name: "{group}\{cm:UninstallProgram,{#MyAppName}}"; Filename: "{uninstallexe}"
          Name: "{autostartup}\{#MyAppName}"; Filename: "{app}\cy-wrapper.ps1"; Comment: "CY-CLI Self-Updating Wrapper"
          Name: "{commondesktop}\{#MyAppName}"; Filename: "{app}\cy-wrapper.ps1"; Tasks: desktopicon

          [Run]
          Filename: "powershell.exe"; Parameters: "-ExecutionPolicy Bypass -File ""{app}\cy-wrapper.ps1"" --version"; Description: "{cm:LaunchProgram,{#MyAppName}}"; Flags: nowait postinstall skipifsilent

          [Registry]
          Root: HKCU; Subkey: "Environment"; ValueType: expandsz; ValueName: "Path"; ValueData: "{olddata};{app}"; Flags: preservestringtype; Tasks: addtopath; Check: NeedsAddPath(ExpandConstant('{app}'))

          [Code]
          function NeedsAddPath(Path: string): Boolean;
          var
            OldPath: string;
          begin
            Result := False;
            if not RegQueryStringValue(HKCU, 'Environment', 'Path', OldPath) then
              Exit;
            Result := Pos(UpperCase(Path), Uppercase(OldPath)) = 0;
          end;
          "@ | Out-File installer.iss

          $iscc = Join-Path $env:ProgramFiles(x86) 'Inno Setup\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            $iscc = Join-Path $env:ProgramFiles 'Inno Setup\ISCC.exe'
          }
          & $iscc installer.iss

          Write-Host "Created $INSTALLER"
          Get-ChildItem $INSTALLER | Select-Object FullName, Length
          Get-FileHash -Algorithm SHA256 $INSTALLER | Select-Object -ExpandProperty Hash | Out-File -FilePath "$INSTALLER.sha256"
        timeout-minutes: 30

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: x86_64-pc-windows-msvc
          path: |
            cy-x86_64-pc-windows-msvc.zip
            cy-x86_64-pc-windows-msvc.zip.sha256
            CY-CLI-x86_64-setup.exe
            CY-CLI-x86_64-setup.exe.sha256
          retention-days: 90
