name: Build Windows

on:
  repository_dispatch:
    types: [release-build]
  workflow_dispatch:
    inputs:
      private_repo:
        description: 'Private source repository (org/name)'
        required: true
        default: 'SYMBIOTYC/cy-cli'
      tag:
        description: 'Git tag or branch to build'
        required: true
        default: 'v0.1.5'

permissions:
  contents: write

jobs:
  build:
    name: Build Windows
    runs-on: windows-2022
    steps:
      - name: Checkout private source code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.private_repo || github.event.client_payload.private_repo }}
          ref: ${{ github.event.inputs.tag || github.event.client_payload.tag }}
          token: ${{ secrets.PAT_FOR_PRIVATE_REPO }}
          path: cy-cli-private

      - name: Checkout release repo assets
        uses: actions/checkout@v4
        with:
          path: release-repo

      - name: Patch recursion limit for Windows
        shell: bash
        run: |
          find cy-cli-private/.fundament/cx-rs -name "lib.rs" -path "*/exec/*" -exec sed -i '1i #![recursion_limit = "256"]' {} +
          find cy-cli-private/.fundament/cx-rs -name "lib.rs" -path "*/tui/*" -exec sed -i '1i #![recursion_limit = "256"]' {} +

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          cache: true

      - name: Patch mio for Windows
        working-directory: cy-cli-private/.fundament/cx-rs
        run: |
          cargo update -p mio
          cargo tree -p mio

      - name: Patch recursion limit for Windows
        shell: bash
        run: |
          find cy-cli-private/.fundament/cx-rs -name "lib.rs" -path "*/exec/*" -exec sed -i '1i #![recursion_limit = "256"]' {} +
          find cy-cli-private/.fundament/cx-rs -name "lib.rs" -path "*/tui/*" -exec sed -i '1i #![recursion_limit = "256"]' {} +

      - name: Build release binary
        working-directory: cy-cli-private/.fundament/cx-rs
        run: cargo build --bin cy --release --target x86_64-pc-windows-msvc
        timeout-minutes: 120

      - name: Package Windows artifact
        shell: bash
        run: |
          BIN="cy-cli-private/.fundament/cx-rs/target/x86_64-pc-windows-msvc/release/cy.exe"
          cp "$BIN" cy.exe
          powershell Compress-Archive -Path cy.exe -DestinationPath cy-x86_64-pc-windows-msvc.zip
          powershell -Command "Get-FileHash -Algorithm SHA256 cy-x86_64-pc-windows-msvc.zip | Select-Object -ExpandProperty Hash | Out-File -FilePath cy-x86_64-pc-windows-msvc.zip.sha256"

      - name: Build Windows .exe installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $BIN = "cy-cli-private/.fundament/cx-rs/target/x86_64-pc-windows-msvc/release/cy.exe"
          $WRAPPER = "${{ github.workspace }}\release-repo\tools\cy-wrapper.ps1"
          $VERSION = "${{ github.event.inputs.tag || github.event.client_payload.tag }}".TrimStart('v')

          & "${{ github.workspace }}\release-repo\tools\build-installer.ps1" `
            -BinPath $BIN `
            -WrapperPath $WRAPPER `
            -Version $VERSION `
            -OutDir "${{ github.workspace }}"
        timeout-minutes: 30

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: x86_64-pc-windows-msvc
          path: |
            cy-x86_64-pc-windows-msvc.zip
            cy-x86_64-pc-windows-msvc.zip.sha256
            CY-CLI-x86_64-setup.exe
            CY-CLI-x86_64-setup.exe.sha256
          retention-days: 90

      - name: Upload to GitHub Release
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.event.client_payload.tag }}
        run: |
          cd release-repo
          for i in {1..12}; do
            gh release upload "$TAG" ../cy-x86_64-pc-windows-msvc.zip ../cy-x86_64-pc-windows-msvc.zip.sha256 ../CY-CLI-x86_64-setup.exe ../CY-CLI-x86_64-setup.exe.sha256 && break
            echo "Release not ready yet, retrying in 10s..."
            sleep 10
          done
