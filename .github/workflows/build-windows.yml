name: Build Windows

on:
  workflow_dispatch:
    inputs:
      private_repo:
        description: 'Private source repository (org/name)'
        required: true
        default: 'SYMBIOTYC/cy-cli'
      tag:
        description: 'Git tag or branch to build'
        required: true
        default: 'v0.1.5'

permissions:
  contents: write

jobs:
  build:
    name: Build Windows
    runs-on: blacksmith-4vcpu-windows-2025
    steps:
      - name: Checkout private source code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.private_repo }}
          ref: ${{ github.event.inputs.tag }}
          token: ${{ secrets.PAT_FOR_PRIVATE_REPO }}
          path: cy-cli-private

      - name: Checkout release repo assets
        uses: actions/checkout@v4
        with:
          path: release-repo

      # `sed -i '1i ...'` prepends unconditionally, so running this twice gives the
      # crate two `#![recursion_limit]` attributes. rustc currently downgrades that
      # to `warning: unused attribute` while warning it "will become a hard error in
      # a future release", so keep the patch idempotent rather than relying on it
      # being applied exactly once.
      - name: Patch recursion limit for Windows
        shell: bash
        run: |
          find cy-cli-private/.fundament/codex-rs -name lib.rs \( -path "*/exec/*" -o -path "*/tui/*" \) -print0 |
          while IFS= read -r -d '' f; do
            if grep -qF '#![recursion_limit = "256"]' "$f"; then
              echo "already patched: $f"
            else
              sed -i '1i #![recursion_limit = "256"]' "$f"
              echo "patched: $f"
            fi
          done

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          cache: true

      - name: Patch mio for Windows
        working-directory: cy-cli-private/.fundament/codex-rs
        run: |
          cargo update -p mio
          cargo tree -p mio

      - name: Build release binary
        working-directory: cy-cli-private/.fundament/codex-rs
        run: cargo build --bin cy --release --target x86_64-pc-windows-msvc
        timeout-minutes: 120

      - name: Package Windows artifact
        shell: bash
        run: |
          BIN="cy-cli-private/.fundament/codex-rs/target/x86_64-pc-windows-msvc/release/cy.exe"
          cp "$BIN" cy.exe
          powershell Compress-Archive -Path cy.exe -DestinationPath cy-x86_64-pc-windows-msvc.zip
          powershell -Command "Get-FileHash -Algorithm SHA256 cy-x86_64-pc-windows-msvc.zip | Select-Object -ExpandProperty Hash | Out-File -FilePath cy-x86_64-pc-windows-msvc.zip.sha256"

      - name: Build Windows .exe installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $BIN = "cy-cli-private/.fundament/codex-rs/target/x86_64-pc-windows-msvc/release/cy.exe"
          $WRAPPER = "${{ github.workspace }}\release-repo\tools\cy-wrapper.ps1"
          $VERSION = "${{ github.event.inputs.tag }}".TrimStart('v')

          & "${{ github.workspace }}\release-repo\tools\build-installer.ps1" `
            -BinPath $BIN `
            -WrapperPath $WRAPPER `
            -Version $VERSION `
            -OutDir "${{ github.workspace }}"
        timeout-minutes: 30

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: x86_64-pc-windows-msvc
          path: |
            cy-x86_64-pc-windows-msvc.zip
            cy-x86_64-pc-windows-msvc.zip.sha256
            CY-CLI-x86_64-setup.exe
            CY-CLI-x86_64-setup.exe.sha256
          retention-days: 90
