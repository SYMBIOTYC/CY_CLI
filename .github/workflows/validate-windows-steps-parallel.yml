name: Validate Windows Build Steps (Parallel Mock Mode)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-step-6:
    name: Step 6 - Patch mio
    runs-on: windows-2022
    steps:
      - name: Setup mock project
        run: |
          $ErrorActionPreference = 'Stop'
          
          # Create mock project structure in workspace
          $projectPath = "${{ github.workspace }}/cy-cli-private/.fundament/codex-rs"
          New-Item -ItemType Directory -Force -Path "$projectPath/src" | Out-Null
          Set-Content -Path "$projectPath/src/main.rs" -Value 'fn main() {}'
          Set-Content -Path "$projectPath/Cargo.toml" -Value @'
          [package]
          name = "cy"
          version = "0.1.0"
          edition = "2021"

          [dependencies]
          mio = "1"
          '@
          
          Write-Host "✓ Mock project created at $projectPath"

      - name: Patch mio with mock project
        working-directory: ${{ github.workspace }}/cy-cli-private/.fundament/codex-rs
        run: |
          $ErrorActionPreference = 'Stop'
          
          # Run actual mio patch commands
          cargo update -p mio
          cargo tree -p mio
          
          Write-Host "✓ Step 6: mio patch completed"

  validate-step-7:
    name: Step 7 - Build binary
    runs-on: windows-2022
    steps:
      - name: Setup mock project
        run: |
          $ErrorActionPreference = 'Stop'
          
          # Create mock project structure
          $projectPath = "${{ github.workspace }}/cy-cli-private/.fundament/codex-rs"
          New-Item -ItemType Directory -Force -Path "$projectPath/src" | Out-Null
          Set-Content -Path "$projectPath/src/main.rs" -Value 'fn main() { println!("mock"); }'
          Set-Content -Path "$projectPath/Cargo.toml" -Value @'
          [package]
          name = "cy"
          version = "0.1.0"
          edition = "2021"
          '@
          
          Write-Host "✓ Mock project created"

      - name: Build release binary with mock
        working-directory: ${{ github.workspace }}/cy-cli-private/.fundament/codex-rs
        run: |
          $ErrorActionPreference = 'Stop'
          
          # Build
          cargo build --bin cy --release --target x86_64-pc-windows-msvc
          
          # Verify binary exists
          $binPath = "target/x86_64-pc-windows-msvc/release/cy.exe"
          if (-not (Test-Path $binPath)) {
            Write-Error "Binary not found: $binPath"
            exit 1
          }
          
          # Verify PE header
          $bytes = [System.IO.File]::ReadAllBytes($binPath)
          if ($bytes[0] -eq 0x4D -and $bytes[1] -eq 0x5A) {
            Write-Host "✓ Step 7: Binary built with valid PE header"
          } else {
            Write-Error "Invalid PE header"
            exit 1
          }

  validate-step-8:
    name: Step 8 - Package artifact
    runs-on: windows-2022
    steps:
      - name: Create mock binary
        run: |
          $ErrorActionPreference = 'Stop'
          
          # Create mock PE file
          [System.IO.File]::WriteAllBytes("${{ github.workspace }}/cy.exe", @(0x4D, 0x5A))
          
          Write-Host "✓ Step 8: Mock binary created"

      - name: Package Windows artifact
        shell: bash
        run: |
          set -e
          cd "${{ github.workspace }}"
          
          cp cy.exe cy-x86_64-pc-windows-msvc.zip
          powershell -Command "Get-FileHash -Algorithm SHA256 cy-x86_64-pc-windows-msvc.zip | Select-Object -ExpandProperty Hash | Out-File -FilePath cy-x86_64-pc-windows-msvc.zip.sha256"
          
          if [ -f "cy-x86_64-pc-windows-msvc.zip" ] && [ -f "cy-x86_64-pc-windows-msvc.zip.sha256" ]; then
            echo "✓ Step 8: Package and hash created"
          else
            echo "✗ Step 8: Package missing"
            exit 1
          fi

  validate-step-9:
    name: Step 9 - Build installer
    runs-on: windows-2022
    steps:
      - name: Create mock inputs
        run: |
          $ErrorActionPreference = 'Stop'
          
          # Create mock binary
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/bin" | Out-Null
          [System.IO.File]::WriteAllBytes("${{ github.workspace }}/bin/cy.exe", @(0x4D, 0x5A))
          
          # Create mock tools directory and wrapper
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/tools" | Out-Null
          Set-Content -Path "${{ github.workspace }}/tools/cy-wrapper.ps1" -Value 'Write-Host "CY-CLI Mock Wrapper"'
          
          Write-Host "✓ Step 9: Mock inputs created"

      - name: Build installer with mock
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          
          $BIN = Join-Path $env:GITHUB_WORKSPACE 'bin/cy.exe'
          $WRAPPER = Join-Path $env:GITHUB_WORKSPACE 'tools/cy-wrapper.ps1'
          $INSTALLER = 'CY-CLI-x86_64-setup.exe'
          $VERSION = '0.1.5'
          
          # Verify inputs
          if (-not (Test-Path $BIN)) {
            Write-Error "Binary missing: $BIN"
            exit 1
          }
          if (-not (Test-Path $WRAPPER)) {
            Write-Error "Wrapper missing: $WRAPPER"
            exit 1
          }
          
          # Create ISS script
          $issPath = Join-Path $env:GITHUB_WORKSPACE 'installer.iss'
          $issContent = @'
          ; CY-CLI Windows Installer
          #define MyAppName "CY-CLI"
          #define MyAppVersion "0.1.5"
          [Setup]
          AppName={#MyAppName}
          OutputDir=${{ github.workspace }}
          OutputBaseFilename=CY-CLI-x86_64-setup
          [Files]
          Source: "bin\cy.exe"; DestDir: "{app}"; Flags: ignoreversion
          '@
          [System.IO.File]::WriteAllText($issPath, $issContent)
          
          # Verify ISS
          if (Test-Path $issPath) {
            Write-Host "✓ Step 9: ISS script generated"
          } else {
            Write-Error "ISS script missing"
            exit 1
          }

  validate-step-10:
    name: Step 10 - Upload artifacts
    runs-on: windows-2022
    steps:
      - name: Create mock artifacts
        run: |
          $ErrorActionPreference = 'Stop'
          
          # Create all required artifacts
          [System.IO.File]::WriteAllBytes("${{ github.workspace }}/cy-x86_64-pc-windows-msvc.zip", @(0x50, 0x4B))
          Set-Content -Path "${{ github.workspace }}/cy-x86_64-pc-windows-msvc.zip.sha256" -Value "abc123"
          [System.IO.File]::WriteAllBytes("${{ github.workspace }}/CY-CLI-x86_64-setup.exe", @(0x4D, 0x5A))
          Set-Content -Path "${{ github.workspace }}/CY-CLI-x86_64-setup.exe.sha256" -Value "def456"
          
          Write-Host "✓ Step 10: Mock artifacts created"

      - name: Validate all artifacts
        shell: bash
        run: |
          set -e
          cd "${{ github.workspace }}"
          
          REQUIRED=(
            "cy-x86_64-pc-windows-msvc.zip"
            "cy-x86_64-pc-windows-msvc.zip.sha256"
            "CY-CLI-x86_64-setup.exe"
            "CY-CLI-x86_64-setup.exe.sha256"
          )
          
          ALL_OK=true
          for file in "${REQUIRED[@]}"; do
            if [ -f "$file" ]; then
              echo "  ✓ $file"
            else
              echo "  ✗ $file MISSING"
              ALL_OK=false
            fi
          done
          
          if [ "$ALL_OK" = true ]; then
            echo "✓ Step 10: All artifacts ready"
          else
            exit 1
          fi

  validation-report:
    name: Validation Report
    needs: [validate-step-6, validate-step-7, validate-step-8, validate-step-9, validate-step-10]
    runs-on: ubuntu-latest
    steps:
      - name: Generate report
        run: |
          echo "## Windows Workflow Validation Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Step | Name | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 6 | Patch mio | ${{ job.validate-step-6.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 7 | Build binary | ${{ job.validate-step-7.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 8 | Package artifact | ${{ job.validate-step-8.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 9 | Build installer | ${{ job.validate-step-9.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 10 | Upload artifacts | ${{ job.validate-step-10.result }} |" >> "$GITHUB_STEP_SUMMARY"
